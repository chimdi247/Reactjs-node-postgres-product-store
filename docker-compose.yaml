services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:pass123@db:5432/products_store

      FRONTEND_URL: http://localhost

      CLERK_SECRET_KEY: sk_test_O4NDVWshf8awPtcqjEWLubfBrkepymYI8njKqXMoGd
      CLERK_PUBLISHABLE_KEY: pk_test_Y2VydGFpbi1kaW5vc2F1ci00MC5jbGVyay5hY2NvdW50cy5kZXYk

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost/api
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2VydGFpbi1kaW5vc2F1ci00MC5jbGVyay5hY2NvdW50cy5kZXYk
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: products_store

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
